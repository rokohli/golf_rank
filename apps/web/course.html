<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details — Fairway</title>
  <meta name="description" content="View course details, community rating, par, slope, and green fees on Fairway.">
  <!-- Deployment-specific API base URL. Can be set at build/deploy time or overridden by window.FAIRWAY_API_URL.
       If empty or absent, course.js falls back to localhost in dev or fairway-api-h93s.onrender.com in production/staging. -->
  <meta name="fairway-api-url" content="https://fairway-api-h93s.onrender.com">
  <!-- App Store / TestFlight download destination for users without the app. Can be overridden by window.FAIRWAY_APP_STORE_URL. -->
  <meta name="fairway-app-store-url" content="https://apps.apple.com/app/fairway-golf/id6742358055">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-link" aria-label="Fairway Home">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        <span>Fairway</span>
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li class="nav-item-features"><a href="index.html#features" class="nav-link">Features</a></li>
          <li class="nav-item-secondary"><a href="terms.html" class="nav-link">Terms</a></li>
          <li class="nav-item-secondary"><a href="privacy.html" class="nav-link">Privacy</a></li>
          <li><a href="index.html#download" class="nav-cta">Get the App</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="container" id="course-container" aria-live="polite">
      <div class="state-box">
        <div class="spinner" aria-hidden="true"></div>
        <p style="color: var(--muted); font-weight: 500;">Loading course details…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-top">
        <a href="index.html" class="brand-link">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
            <line x1="4" y1="22" x2="4" y2="15"></line>
          </svg>
          <span>Fairway</span>
        </a>
        <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="terms.html">Terms of Service</a></li>
          <li><a href="privacy.html">Privacy Policy</a></li>
        </ul>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Fairway. All rights reserved.</p>
        <p class="footer-attribution">Course catalog data © OpenGolfAPI, ODbL 1.0</p>
      </div>
    </div>
  </footer>

  <script src="course.js"></script>
</body>
</html>
