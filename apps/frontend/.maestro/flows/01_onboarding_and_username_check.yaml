appId: com.rokohli.golfrank.dev
---
# Flow 1: Onboarding Profile Creation & Real-Time Username Check
- launchApp:
    clearState: true

- assertVisible: "Build Your Profile"

# 1. Fill profile names
- tapOn: "First Name"
- inputText: "Alice"
- tapOn: "Last Name"
- inputText: "Walker"

# 2. Test taken username error state
- tapOn: "Username"
- inputText: "taken_user"
- assertVisible: "That username is already taken."

# 3. Enter unique username
- eraseText
- inputText: "alice_golfs"
- assertVisible: "Continue"
- tapOn: "Continue"

# 4. Home course search step
- assertVisible: "What's your home course?"
- tapOn: "Search courses"
- inputText: "Pebble"
- tapOn: "Pebble Beach Golf Links Monterey, CA"
- tapOn: "Continue"

# 5. Played courses step - the streamlined flow requires 2 courses to unlock the ranking step
- assertVisible: "Pick 2 courses you've played"
- tapOn: "Search courses you've played"
- inputText: "Spyglass"
- tapOn: "Spyglass Hill Golf Course Monterey, CA"
- tapOn: "Search courses you've played"
- eraseText
- inputText: "Pasatiempo"
- tapOn: "Pasatiempo Golf Club Santa Cruz, CA"
- tapOn: "Continue with 2 selected"

# 6. Head-to-Head ranking duel step
- assertVisible: "Which course did you enjoy more?"
- tapOn:
    text: "Choose .*"

# 7. Dream courses step - skip
- assertVisible: "What courses are on your bucket list?"
- tapOn: "Skip"

# 8. Contacts step - skip
- assertVisible: "Connect with friends"
- tapOn: "Skip"

# 9. Budget step
- assertVisible: "What's your typical green fee budget?"
- tapOn: "$$ $50 – $100"
- tapOn:
    text: "Continue with .*"

# 10. Notifications step - skip
- assertVisible: "Stay in the loop"
- tapOn: "Skip"

# 11. Complete onboarding and land on Home
- assertVisible: "You're all set!"
- tapOn: "Explore Home"
- assertVisible: "Featured Courses"
