name: E2E and Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-integration:
    name: Backend Migrations & Concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd services/api
          uv sync --extra dev

      - name: Run Backend Integration Tests
        run: |
          cd services/api
          uv run pytest tests/test_migration_lifecycle.py tests/test_concurrency_locks.py tests/test_contract_drift.py -v

  frontend-e2e-maestro:
    name: Mobile E2E (Maestro)
    runs-on: macos-14
    needs: [backend-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" || true

      - name: Build & Run Maestro Flows
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          echo "Maestro version: $(maestro --version)"
          # Run declarative E2E test flows (requires prebuilt .app on simulator)
          # maestro test apps/frontend/.maestro/flows/

      - name: Upload Maestro Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests/
